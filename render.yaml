services:
  - type: web
    name: pkx404-xparty
    runtime: node
    plan: free
    rootDir: xparty-service
    branch: xparty/first-build-20260928
    buildCommand: npm ci --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        value: https://pkx404.github.io
      - key: TRUST_PROXY
        value: "1"
# Set TURN_URLS and TURN_SECRET securely in Render for reliable cross-network calls.
# Optionally set YOUTUBE_API_KEY for in-app search. Pasted links need no search key.
